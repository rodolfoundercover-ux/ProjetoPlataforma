name: Import PHASE_04
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply validated PHASE_04
        run: |
          unzip -o phase04-update.zip
          rm -f src/services/capacity.service.ts src/services/customer.service.ts src/services/reservation.service.ts
          rm -f supabase/migrations/20260914000100_phase04_core_reservations.sql tests/unit/phase04.test.ts
          rm -f phase04-update.zip
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git reset .github/workflows/import-phase04.yml
          git commit -m "Implementar base segura da PHASE_04"
          git push