project_id = "travel-platform"
[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 55322
shadow_port = 55320
major_version = 17
[db.migrations]
enabled = true
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 55323
[inbucket]
enabled = true
port = 55324
smtp_port = 55325
pop3_port = 55326
[storage]
enabled = true
file_size_limit = "10MiB"
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = false
[auth.email]
# CLI maps this field to the email provider switch.
# Global auth.enable_signup=false above still blocks public registration.
enable_signup = true
enable_confirmations = true
[analytics]
enabled = false
